name: Update Weekly Drip

on:
  schedule:
    - cron: '5 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Weekly Drip data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node site/scripts/update-weekly-drip.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- site/data/weekly-drip.json; then
            echo "No Weekly Drip changes to commit."
            exit 0
          fi

          git config user.name "weekly-drip-bot"
          git config user.email "weekly-drip-bot@users.noreply.github.com"

          git add site/data/weekly-drip.json
          git commit -m "Refresh Weekly Drip"
          git push